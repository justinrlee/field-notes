<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Struggle Trigger</title>
<style>
  :root { --bg:#0e1117; --card:#1a1a2e; --text:#e0e0e0; --muted:#9aa0aa; --accent:#4fc3f7; --ok:#66bb6a; --err:#ef5350; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.5rem; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); }
  .card { background:var(--card); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .card h2 { margin:0; font-size:1.05rem; }
  .card p { margin:0; color:var(--muted); font-size:.9rem; flex:1; }
  .players { font-size:.8rem; color:var(--muted); font-family:ui-monospace, monospace; }
  button { background:var(--accent); color:#06222e; border:0; border-radius:8px; padding:10px 14px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .status { min-height:1.2em; font-size:.85rem; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Player Struggle Trigger</h1>
  <p class="sub">Each button sends a scripted burst for a dedicated demo player (about {{ pace|int }} s between deaths). Watch the dashboard for the result.</p>
  <div class="grid">
  {% for s in scenarios %}
    <section class="card">
      <h2>{{ s.title }}</h2>
      <p>{{ s.blurb }}</p>
      <div class="players">{{ s.players | join(", ") }}</div>
      <button data-id="{{ s.id }}">Trigger</button>
      <div class="status" id="status-{{ s.id }}"></div>
    </section>
  {% endfor %}
  </div>
</main>
<script>
  document.querySelectorAll("button[data-id]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const status = document.getElementById("status-" + id);
      btn.disabled = true;
      status.className = "status"; status.textContent = "Sending...";
      try {
        const res = await fetch("/trigger", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({scenario: id}),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.detail || res.statusText);
        status.className = "status ok";
        status.textContent = "Burst started (~" + body.approx_seconds + " s).";
        setTimeout(() => { btn.disabled = false; }, body.approx_seconds * 1000 + 1000);
      } catch (err) {
        status.className = "status err"; status.textContent = String(err.message || err);
        btn.disabled = false;
      }
    });
  });
</script>
</body>
</html>
